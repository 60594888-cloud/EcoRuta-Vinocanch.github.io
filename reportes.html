<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRuta | Reportes</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>🗑️ Reportes de residuos</h1>
        <p>Registra los problemas de limpieza del mercado.</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="mapa.html">Mapa de prioridades</a>
        <a href="reportes.html">Reportes</a>
        <a href="recompensas.html">Recompensas</a>
        <a href="admin.html">Administración</a>
    </nav>

    <main class="contenedor">
        <section class="panel">
            <h2>Nuevo reporte</h2>

            <form id="form-reporte">
                <label for="sector">Sector del mercado</label>
                <select id="sector" required>
                    <option value="">Selecciona un sector</option>
                    <option value="Entrada principal">Entrada principal</option>
                    <option value="Zona de frutas y verduras">Zona de frutas y verduras</option>
                    <option value="Zona de carnes">Zona de carnes</option>
                    <option value="Zona de comidas">Zona de comidas</option>
                    <option value="Zona de residuos">Zona de residuos</option>
                </select>

                <label for="tipo-residuo">Tipo de residuo</label>
                <select id="tipo-residuo" required>
                    <option value="">Selecciona el tipo</option>
                    <option value="Orgánico">Orgánico</option>
                    <option value="Plástico">Plástico</option>
                    <option value="Papel y cartón">Papel y cartón</option>
                    <option value="Vidrio">Vidrio</option>
                    <option value="Residuos mezclados">Residuos mezclados</option>
                </select>

                <label for="urgencia">Nivel de urgencia</label>
                <select id="urgencia" required>
                    <option value="Baja">Baja</option>
                    <option value="Media">Media</option>
                    <option value="Alta">Alta</option>
                </select>

                <label for="descripcion">Descripción del problema</label>
                <textarea id="descripcion" rows="4" required
                    placeholder="Describe el problema y el lugar donde ocurre"></textarea>

                <button type="submit">Enviar reporte</button>
            </form>

            <p id="mensaje-reporte"></p>
        </section>

        <section class="panel">
            <h2>Reportes registrados</h2>

            <label for="filtro-estado">Filtrar por estado</label>
            <select id="filtro-estado" onchange="cargarReportes()">
                <option value="">Todos</option>
                <option value="pendiente">Pendientes</option>
                <option value="aprobado">Aprobados</option>
                <option value="resuelto">Resueltos</option>
                <option value="rechazado">Rechazados</option>
            </select>

            <div id="lista-reportes">
                <p>Los reportes aparecerán aquí.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>EcoRuta Vinocanchón © 2026</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="configuracion.js"></script>
    <script src="codigo.js"></script>
</body>
</html>
