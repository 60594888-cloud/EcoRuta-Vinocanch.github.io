<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRuta Vinocanchón | Iniciar sesión</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="contenedor-login">
        <section class="tarjeta-login">
            <h1>🌱 EcoRuta Vinocanchón</h1>
            <p>Un mercado más limpio comienza contigo.</p>

            <form id="form-login">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" required placeholder="ejemplo@correo.com">

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" required placeholder="Tu contraseña">

                <button type="submit">Iniciar sesión</button>
            </form>

            <hr>

            <form id="form-registro">
                <h2>Crear cuenta</h2>

                <label for="correo-registro">Correo electrónico</label>
                <input type="email" id="correo-registro" required>

                <label for="contrasena-registro">Contraseña</label>
                <input type="password" id="contrasena-registro" minlength="6" required>

                <button type="submit" class="boton-secundario">Registrarme</button>
            </form>

            <p id="mensaje"></p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="configuracion.js"></script>
    <script src="codigo.js"></script>
</body>
</html>
