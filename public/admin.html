<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRuta | Administración</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>⚙️ Panel de administración</h1>
        <p>Revisión y gestión de reportes del mercado.</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="mapa.html">Mapa de prioridades</a>
        <a href="reportes.html">Reportes</a>
        <a href="recompensas.html">Recompensas</a>
        <a href="admin.html">Administración</a>
    </nav>

    <main class="contenedor">
        <section class="panel">
            <h2>Verificación de acceso</h2>
            <p id="estado-admin">Comprobando permisos...</p>
        </section>

        <section class="panel">
            <h2>Gestión de reportes</h2>

            <label for="filtro-admin">Estado del reporte</label>
            <select id="filtro-admin" onchange="cargarReportesAdmin()">
                <option value="">Todos</option>
                <option value="pendiente">Pendientes</option>
                <option value="aprobado">Aprobados</option>
                <option value="resuelto">Resueltos</option>
                <option value="rechazado">Rechazados</option>
            </select>

            <div id="reportes-admin">
                <p>Cargando reportes...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>EcoRuta Vinocanchón © 2026</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="configuracion.js"></script>
    <script src="codigo.js"></script>
</body>
</html>
